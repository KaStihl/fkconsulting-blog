baseURL = "https://fkconsult.eu/"
title = "FK Consult"
theme = "PaperMod"
paginate = 10
defaultContentLanguage = "sk"
defaultContentLanguageInSubdir = false

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[languages]
  [languages.sk]
    label = "Slovenčina"
    locale = "sk-SK"
    weight = 1
    [languages.sk.params]
      description = "BI konzultácie, analytika a dátové projekty — Power BI, automatizácia a dashboardy"
      [languages.sk.params.homeInfoParams]
        Title = "Z dát k rozhodnutiam"
        Content = """
<div class="fk-hero" data-animate>
  <img src="/logo/fk-consult-banner.jpg" width="949" height="672" alt="FK Consult — dátová analytika a BI konzultácie" loading="eager">
</div>

BI konzultácie a analytika pre malé aj stredné firmy — **Power BI dashboardy**, **automatizácia dátových tokov** a **konzultácie**, ktoré premenia tabuľky na rozhodnutia. Aktuálny showcase: živé sledovanie leteckej dopravy medzi [Viedňou a Bratislavou](/projekty/vie-bts-tracker/).
"""
    [[languages.sk.menu.main]]
      identifier = "about"
      name = "O mne"
      url = "/about/"
      weight = 10
    [[languages.sk.menu.main]]
      identifier = "services"
      name = "Služby"
      url = "/services/"
      weight = 20
    [[languages.sk.menu.main]]
      identifier = "projekty"
      name = "Projekty"
      url = "/projekty/"
      weight = 30
    [[languages.sk.menu.main]]
      identifier = "dashboard"
      name = "Dashboard"
      url = "/dashboard/"
      weight = 40
    [[languages.sk.menu.main]]
      identifier = "contact"
      name = "Kontakt"
      url = "/contact/"
      weight = 50

  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 2
    [languages.en.params]
      description = "BI consulting, analytics and data projects — Power BI, automation and dashboards"
      [languages.en.params.homeInfoParams]
        Title = "Turning data into decisions"
        Content = """
<div class="fk-hero" data-animate>
  <img src="/logo/fk-consult-banner.jpg" width="949" height="672" alt="FK Consult — data analytics and BI consulting" loading="eager">
</div>

BI consulting and analytics for small and mid-size businesses — **Power BI dashboards**, **data pipeline automation**, and **consulting** that turn spreadsheets into decisions. Current showcase: live tracking of air traffic between [Vienna and Bratislava](/projekty/vie-bts-tracker/).
"""
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "services"
      name = "Services"
      url = "/services/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "projekty"
      name = "Projects"
      url = "/projekty/"
      weight = 30
    [[languages.en.menu.main]]
      identifier = "dashboard"
      name = "Dashboard"
      url = "/dashboard/"
      weight = 40
    [[languages.en.menu.main]]
      identifier = "contact"
      name = "Contact"
      url = "/contact/"
      weight = 50

  [languages.de]
    label = "Deutsch"
    locale = "de-DE"
    weight = 3
    [languages.de.params]
      description = "BI-Beratung, Analytik und Datenprojekte — Power BI, Automatisierung und Dashboards"
      [languages.de.params.homeInfoParams]
        Title = "Aus Daten werden Entscheidungen"
        Content = """
<div class="fk-hero" data-animate>
  <img src="/logo/fk-consult-banner.jpg" width="949" height="672" alt="FK Consult — Datenanalyse und BI-Beratung" loading="eager">
</div>

BI-Beratung und Analytik für kleine und mittlere Unternehmen — **Power BI Dashboards**, **Automatisierung von Datenprozessen** und **Beratung**, die aus Tabellen Entscheidungen macht. Aktuelles Projekt: Live-Tracking des Flugverkehrs zwischen [Wien und Bratislava](/projekty/vie-bts-tracker/).
"""
    [[languages.de.menu.main]]
      identifier = "about"
      name = "Über mich"
      url = "/about/"
      weight = 10
    [[languages.de.menu.main]]
      identifier = "services"
      name = "Leistungen"
      url = "/services/"
      weight = 20
    [[languages.de.menu.main]]
      identifier = "projekty"
      name = "Projekte"
      url = "/projekty/"
      weight = 30
    [[languages.de.menu.main]]
      identifier = "dashboard"
      name = "Dashboard"
      url = "/dashboard/"
      weight = 40
    [[languages.de.menu.main]]
      identifier = "contact"
      name = "Kontakt"
      url = "/contact/"
      weight = 50

[params]
  env = "production"
  title = "FK Consult"
  defaultTheme = "dark"
  disableThemeToggle = false
  displayFullLangName = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  comments = false

  [params.label]
    text = "FK Consult"
    icon = "/logo/fk-monogram-tile.png"
    iconHeight = 32

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    theme_color = "#0B1A2B"
    msapplication_TileColor = "#0B1A2B"

  [[params.socialIcons]]
    name = "github"
    title = "GitHub"
    url = "https://github.com/KaStihl"

  [[params.socialIcons]]
    name = "email"
    title = "Email"
    url = "mailto:ferdinand.fojtlin@gmail.com"
