{{- $src := .Get "src" }}
{{- $title := .Get "title" | default "VIE/BTS Dashboard" }}
{{- $height := .Get "height" | default "600" }}
{{- if $src }}
<div class="dashboard-frame" data-animate>
  <iframe src="{{ $src }}" title="{{ $title }}" loading="lazy" allowfullscreen frameborder="0" style="height: {{ $height }}px;"></iframe>
</div>
{{- else }}
<div class="dashboard-placeholder" data-animate>
  <p>{{ i18n "dash_placeholder_title" }}</p>
  <p>{{ i18n "dash_placeholder_text" }}</p>
</div>
{{- end }}
